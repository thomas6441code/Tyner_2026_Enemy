name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ── yner_main (Laravel) ───────────────────────────────────────────────────────
  yner_main:
    name: yner_main — Pint + PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yner_main

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: eapms_test
          MYSQL_USER: eapms
          MYSQL_PASSWORD: secret
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, xml, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Copy .env
        run: cp .env.example .env && php artisan key:generate

      - name: Run Pint (lint)
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  # ── AI Service ────────────────────────────────────────────────────────────────
  ai-service:
    name: ai-service — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest

  # ── Bio Service ───────────────────────────────────────────────────────────────
  bio-service:
    name: bio-service — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bio-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bio-service/requirements.txt

      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest
