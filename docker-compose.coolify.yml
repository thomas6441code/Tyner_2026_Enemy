services:

  # ── yner_main (Laravel — core app) ───────────────────────────────────────────
  yner_main:
    build:
      context: ./yner_main
      dockerfile: Dockerfile
    environment:
      APP_NAME: "EAPM_System"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://tyner.skyportcargo.co.tz}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      AI_SERVICE_URL: http://ai-service:8001
      BIO_SERVICE_URL: http://bio-service:8002
    volumes:
      - yner_main_storage:/var/www/html/storage/app
    expose:
      - "8000"
    restart: unless-stopped

  # ── AI Service ────────────────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      LARAVEL_BASE_URL: http://yner_main:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-4.5}
    expose:
      - "8001"
    restart: unless-stopped

  # ── Bio Service (Biometric Adapter) ──────────────────────────────────────────
  bio-service:
    build:
      context: ./bio-service
      dockerfile: Dockerfile
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      LARAVEL_BASE_URL: http://yner_main:8000
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
    expose:
      - "8002"
    depends_on:
      - yner_main
    restart: unless-stopped

volumes:
  yner_main_storage:

networks:
  default:
    name: coolify
    external: true
