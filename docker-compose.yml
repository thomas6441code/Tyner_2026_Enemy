services:

  # ── MySQL ────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-eapms}
      MYSQL_USER: ${DB_USERNAME:-eapms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # ── yner_main (Laravel — core app) ───────────────────────────────────────────
  yner_main:
    build:
      context: ./yner_main
      dockerfile: Dockerfile
    environment:
      APP_NAME: "Employee Attendance & Permission Management System"
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-eapms}
      DB_USERNAME: ${DB_USERNAME:-eapms}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-change-me-in-production}
      AI_SERVICE_URL: http://ai-service:8001
      BIO_SERVICE_URL: http://bio-service:8002
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./yner_main:/var/www/html
    ports:
      - "8000:8000"

  # ── AI Service ────────────────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-change-me-in-production}
      LARAVEL_BASE_URL: http://yner_main:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: claude-sonnet-4-6
    ports:
      - "8001:8001"

  # ── Bio Service (Biometric Adapter) ──────────────────────────────────────────
  bio-service:
    build:
      context: ./bio-service
      dockerfile: Dockerfile
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-change-me-in-production}
      LARAVEL_BASE_URL: http://yner_main:8000
      POLL_INTERVAL_SECONDS: 300
    depends_on:
      - yner_main

volumes:
  mysql_data:
